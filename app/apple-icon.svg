<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Big Bats">
  <!--
    The iOS home-screen icon. Unlike the favicon this one is never shown small,
    so it can carry a filled background (iOS does not honour transparency and
    would composite it onto black) and slightly richer stitching.
  -->
  <rect width="180" height="180" fill="#18181b" />
  <circle cx="90" cy="90" r="62" fill="#fafafa" />
  <g fill="none" stroke="#18181b" stroke-width="3" stroke-linecap="round">
    <path d="M56 39c-11 15-16 33-13 51 3 18 12 34 25 46" />
    <path d="M124 39c11 15 16 33 13 51-3 18-12 34-25 46" />
  </g>
  <g fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M50 58l11 4M46 74l11 2M45 91l11-1M47 108l11-3M53 124l10-6" />
    <path d="M130 58l-11 4M134 74l-11 2M135 91l-11-1M133 108l-11-3M127 124l-10-6" />
  </g>
</svg>

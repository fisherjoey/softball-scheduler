<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Big Bats">
  <!--
    A softball, drawn to stay readable at 16px in a browser tab: one solid
    disc for the silhouette and two stitch arcs for the tell. Finer detail
    (individual stitches, seam shading) turns to mush at favicon size, so it
    is deliberately left out.
  -->
  <circle cx="16" cy="16" r="15" fill="#18181b" />
  <g fill="none" stroke="#fafafa" stroke-width="1.6" stroke-linecap="round">
    <path d="M9.2 2.6C6.4 6.6 5.2 11.2 5.9 16c.7 4.8 3.1 9 6.6 12.2" />
    <path d="M22.8 2.6c2.8 4 4 8.6 3.3 13.4-.7 4.8-3.1 9-6.6 12.2" />
  </g>
  <g fill="none" stroke="#f87171" stroke-width="1.5" stroke-linecap="round">
    <path d="M8.1 7.4l2.5 1M7.2 11.3l2.6.5M7.1 15.4l2.7-.1M7.7 19.4l2.6-.7M9 23.2l2.4-1.3" />
    <path d="M23.9 7.4l-2.5 1M24.8 11.3l-2.6.5M24.9 15.4l-2.7-.1M24.3 19.4l-2.6-.7M23 23.2l-2.4-1.3" />
  </g>
</svg>
